      Written "Paint'n Pete", said "Paintin' Pete". Any voice agent, video
      voiceover, or radio read must be given the spoken spelling, not the
      written one — text-to-speech reads the apostrophe as a letter N and
      produces "Paint N Pete". The live KaiCalls agent has said "Peyton Pete",
