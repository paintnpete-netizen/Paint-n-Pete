# =============================================================================
# BUSINESS PROFILE — the config layer
# =============================================================================
# Every template, prompt, SOP, form spec, and web page in this back office
# reads its facts from this file. Nothing downstream hardcodes a company name,
# a city, or a phone number.
#
# To stand up a second operator: copy this file, change the values, leave the
# rest of the back office untouched. That is the whole franchise mechanism.
#
# STATUS FLAGS — every claim carries one:
#   verified   Noah has confirmed it. Safe to publish, send, or print.
#   unverified Do NOT put in front of a client, GC, or crew until confirmed.
#   todo       Noah still needs to supply this.
# =============================================================================

