    - Florida Paints
    - Farrow & Ball
  selection_principle: >
    Products are chosen for substrate and exposure, not for price per gallon.

# -----------------------------------------------------------------------------
# Craft philosophy — the source of the differentiation, so it drives all copy
# -----------------------------------------------------------------------------
philosophy:
  - "Prep is most of the job."
  - "Coatings cure on their schedule, not ours."
  - "Products are specified for the surface and its exposure."
  - "The last ten percent is the part nobody else finishes."

ideal_client: >
  Homeowners, interior designers, and architects who care about the last ten
  percent — the details most people never notice.

# -----------------------------------------------------------------------------
# Voice — enforced across every generated document
# -----------------------------------------------------------------------------
voice:
  register: "Direct, craftsman, factual."
  person: "Third person for company documents; first person for texts and emails from Noah."
  forbidden:
    - exclamation points
    - superlatives and hype
    - "self-describing 'premium' or 'luxury'"
    - "'transformation Tuesday' and similar social clichés"
    - discount language
    - apologising for price

