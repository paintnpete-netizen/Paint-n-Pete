# -----------------------------------------------------------------------------
# Tool stack — resolved 2026-08-19
# -----------------------------------------------------------------------------
stack:
  platform: "Google Workspace"
  ai_writing: "Claude (long documents, proposals, SOPs, photo-to-scope)"
  ai_quick: "ChatGPT (short drafts, captions)"
  documents: "Google Docs"
  spreadsheets: "Google Sheets"
  forms: "Google Forms"
  storage: "Google Drive"
  calendar: "Google Calendar"
  email: "Google Workspace on paintnpete.com — verified live 2026-08-19 (MX smtp.google.com)"
  automation: "Google Apps Script"
  automation_note: >
    The guide defaults to Make.com, whose free tier allows only 2 active
    scenarios on 1,000 credits/month — not enough for the six workflows in
    Section 7. Apps Script is included with Workspace, has no scenario cap,
    is native to Sheets/Forms/Gmail/Calendar, and is version-controllable in
    this repo. Make.com is kept as a fallback only for third-party services
    Apps Script cannot reach.
  design: "Canva (free)"
  research: "Perplexity"
  web_editing: "Cursor"
  hosting: "Netlify"
  phone: "KaiCalls — AI phone secretary"
  phone_note: >
    Answers 24/7, runs intake, books onto Google Calendar, texts missed callers
    back, and sends a lead summary by SMS and email. Replaces the missed-call
    text-back, the consultation-booking workflow, and the SMS alert that Apps
    Script cannot send. Not the system of record — leads still land in the Leads
    tab. Configuration procedure in 03-leads/kai-setup.md.
  phone_rules:
    - "Never quotes a price, not even a range."
    - "Declines out-of-area work gracefully."
    - "Escalates rather than improvising on anything it wasn't told."
