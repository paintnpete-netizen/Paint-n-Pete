declines:
  status: todo
  note: >
    The guide (2.1) asks explicitly what you decline to do. This is one of the
    most useful things in the brief — it stops the AI proposing work you don't
    want and stops you being drawn into jobs you'd regret. Common candidates:
    roof coatings, pressure-wash-only jobs, pure handyman work, insurance
    restoration, jobs where the client supplies the paint, anything under a
    minimum dollar value. Noah to fill in.

